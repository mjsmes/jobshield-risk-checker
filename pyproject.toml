[project]
name = "jobshield-risk-checker"
version = "0.1.0"
description = "JobShield - Python-based job scam detection and risk analysis"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "analysis_engine"]
packages = ["jobshield_web"]
[tool.setuptools.package-data]
jobshield_web = ["*.html", "*.css", "*.js", "*.svg"]
