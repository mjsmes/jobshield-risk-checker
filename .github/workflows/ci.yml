name: JobShield CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install root project
        run: python -m pip install .

      - name: Install CI tools
        run: python -m pip install ruff==0.17.3 coverage pip-audit==2.10.1

      - name: Audit production dependencies
        run: pip-audit -r artifacts/jobshield/requirements.lock

      - name: Lint Python files
        run: ruff check .

      - name: Run tests with coverage
        run: python -m coverage run --source=app,analysis_engine -m unittest discover -s tests -v

      - name: Run production Flask tests
        working-directory: artifacts/jobshield
        run: python -m unittest discover -s tests -v

      - name: Enforce coverage threshold
        run: python -m coverage report --fail-under=70

  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build workspace
        run: pnpm run build
        env:
          PORT: 3000
          BASE_PATH: /
